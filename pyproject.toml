[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-logbrain"
dynamic = ["version"]
description = "Minecraft LogBrain — AI-powered crash log diagnosis platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MCA Team" }]
license = { text = "MIT" }

dependencies = [
  "packaging>=23.2",
]

[project.urls]
Homepage = "https://github.com/JohnnyEisen/minecraft-logbrain"
Repository = "https://github.com/JohnnyEisen/minecraft-logbrain.git"
Issues = "https://github.com/JohnnyEisen/minecraft-logbrain/issues"

[project.optional-dependencies]
ai = [
  "torch>=2.0.0",
  "transformers>=4.38.0",
  "numpy>=1.26.0",
]
crypto = [
  "cryptography>=42.0.0",
]
observability = [
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.22.0",
  "opentelemetry-sdk>=1.22.0",
]
server = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
]
config = [
  "python-consul2>=0.1.5",
]
ha = [
  "redis>=5.0.0",
]

[project.scripts]
logbrain = "main:main"
logbrain-cli = "brain_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.setuptools.dynamic]
version = {attr = "brain_system.__version__"}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
